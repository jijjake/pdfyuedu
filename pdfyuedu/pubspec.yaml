name: pdfyuedu
description: A cross-platform book library app.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  provider: ^6.1.1
  http: ^1.1.0
  pdfx: ^2.5.0
  epub: ^3.1.0
  webdav_client: ^1.5.4
  flutter_secure_storage: ^9.0.0
  uuid: ^4.0.0
  file_picker: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
