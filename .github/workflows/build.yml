name: Build Flutter App

on:
  push:
    branches: [ trae/solo-agent-4My6nm ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      
      - name: Check pubspec.yaml
        run: |
          cd pdfyuedu
          cat pubspec.yaml
      - name: Install dependencies
        run: |
          cd pdfyuedu
          flutter pub get
      
      - name: Build APK
        run: |
          cd pdfyuedu
          flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pdfyuedu-apk
          path: pdfyuedu/build/app/outputs/flutter-apk/app-release.apk
  
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
      
      - name: Check pubspec.yaml
        run: |
          cd pdfyuedu
          cat pubspec.yaml
      - name: Install dependencies
        run: |
          cd pdfyuedu
          flutter pub get
      
      - name: Build Web
        run: |
          cd pdfyuedu
          flutter build web
      
      - name: Upload Web
        uses: actions/upload-artifact@v4
        with:
          name: pdfyuedu-web
          path: pdfyuedu/build/web
